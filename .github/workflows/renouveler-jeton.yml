name: Renouveler le jeton Instagram

# Le jeton Instagram expire au bout de 60 jours. Ce workflow le renouvelle chaque
# semaine et remplace le secret IG_ACCESS_TOKEN. Il a besoin d'un second secret,
# GH_PAT : un jeton GitHub à accès fin, limité à ce dépôt, avec la permission
# « Secrets : lecture et écriture ».

on:
  schedule:
    - cron: "41 6 * * 1"   # chaque lundi, 06:41 UTC
  workflow_dispatch:

jobs:
  renouveler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renouveler et enregistrer
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GH_PAT absent : impossible d'enregistrer le nouveau jeton."
            exit 1
          fi
          NOUVEAU=$(python3 publish.py renouveler)
          echo "::add-mask::$NOUVEAU"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NOUVEAU"
          echo "Secret IG_ACCESS_TOKEN mis à jour."
